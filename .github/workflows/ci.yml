name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  GODOT_VERSION: 4.7.2

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.425

      - name: Validate repository structure
        run: bash scripts/validate-project-structure.sh

      - name: Validate asset catalog contract
        run: |
          python scripts/assets/validate_catalog.py
          python -m unittest discover -s scripts/assets -p 'test_*.py'

      - name: Restore
        run: dotnet restore DeskTown.sln

      - name: Build
        run: dotnet build DeskTown.sln --configuration Release --no-restore

      - name: Test
        run: >-
          dotnet test DeskTown.sln
          --configuration Release
          --no-build
          --logger "trx;LogFileName=tests.trx"
          --collect "XPlat Code Coverage"

      - name: Generate deterministic demo saves
        run: |
          dotnet run --project tools/DeskTown.DemoSaves --configuration Release -- build/demo-saves 2026-09-25
          dotnet run --project tools/DeskTown.DemoSaves --configuration Release -- build/demo-saves-repeat 2026-09-25
          diff -qr build/demo-saves build/demo-saves-repeat

      - name: Upload isolated demo saves
        uses: actions/upload-artifact@v4
        with:
          name: desktown-demo-saves
          path: build/demo-saves/**
          if-no-files-found: error

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/**'
          if-no-files-found: warn

  godot-windows-export:
    name: Godot import and Windows export
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.425

      - name: Restore and build C#
        run: |
          dotnet restore DeskTown.sln
          dotnet build DeskTown.sln --configuration Release --no-restore

      - name: Install Godot .NET and export templates
        run: bash scripts/ci/install-godot.sh

      - name: Import project headlessly
        run: godot --headless --editor --path . --quit-after 5

      - name: Launch main scene headlessly
        run: |
          mkdir -p build
          godot --headless --path . --quit-after 120 2>&1 | tee build/runtime-smoke.log
          if rg -n '^ERROR:|SCRIPT ERROR:' build/runtime-smoke.log; then
            exit 1
          fi

      - name: Export Windows prototype
        run: |
          mkdir -p build/windows
          godot --headless --path . --export-release "Windows Desktop" build/windows/DeskTown.exe

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: desktown-windows-foundation
          path: build/windows/**
          if-no-files-found: error

      # The tested export above contains only the unassigned production catalog.
      # Synthetic PNGs are added afterward in this disposable checkout.
      - name: Smoke assigned catalog art in Town and Companion scenes
        run: |
          python scripts/assets/create_smoke_art.py
          python scripts/assets/validate_catalog.py
          godot --headless --editor --path . --quit-after 5
          DESKTOWN_CI_ART_SMOKE=1 godot --headless --path . --quit-after 120 2>&1 | tee build/catalog-art-smoke.log
          if rg -n '^ERROR:|SCRIPT ERROR:|DESKTOWN_CI_ART_SMOKE_FAILED' build/catalog-art-smoke.log; then
            exit 1
          fi
          rg -q 'DESKTOWN_CI_ART_SMOKE_OK' build/catalog-art-smoke.log

  windows-export-smoke:
    name: Launch exported Windows build
    needs: godot-windows-export
    runs-on: windows-latest
    timeout-minutes: 8

    steps:
      - name: Download exported build
        uses: actions/download-artifact@v4
        with:
          name: desktown-windows-foundation
          path: build/windows

      - name: Download demo saves
        uses: actions/download-artifact@v4
        with:
          name: desktown-demo-saves
          path: build/demo-saves

      - name: Launch executable headlessly
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'build/windows/DeskTown.exe').Path
          $stdout = Join-Path $env:RUNNER_TEMP 'desktown-startup-stdout.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'desktown-startup-stderr.log'
          $process = Start-Process -FilePath $exe -ArgumentList @('--headless', '--quit-after', '120') -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          if (-not $process.WaitForExit(45000)) {
            $process.Kill()
            throw 'Exported DeskTown.exe did not exit within 45 seconds.'
          }
          $log = (Get-Content $stdout -Raw) + "`n" + (Get-Content $stderr -Raw)
          Write-Output $log
          if ($process.ExitCode -ne 0 -or $log -match '(?m)^(ERROR:|SCRIPT ERROR:)') {
            throw "Exported DeskTown.exe smoke failed with exit code $($process.ExitCode)."
          }

      - name: Save, restart, and recover in exported executable
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'build/windows/DeskTown.exe').Path
          $env:DESKTOWN_CI_SMOKE = '1'
          $smokeDirectory = Join-Path $env:RUNNER_TEMP ('desktown-save-smoke-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $smokeDirectory | Out-Null
          $env:DESKTOWN_CI_SMOKE_SAVE = Join-Path $smokeDirectory 'save.json'

          foreach ($phase in @('write', 'recover', 'check')) {
            $stdout = Join-Path $smokeDirectory "$phase.stdout.log"
            $stderr = Join-Path $smokeDirectory "$phase.stderr.log"
            $process = Start-Process -FilePath $exe -ArgumentList @('--headless', '--', "--desktown-ci-save-smoke=$phase") -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
            if (-not $process.WaitForExit(45000)) {
              $process.Kill()
              throw "Exported DeskTown.exe $phase phase did not exit within 45 seconds."
            }
            $log = (Get-Content $stdout -Raw) + "`n" + (Get-Content $stderr -Raw)
            Write-Output $log
            if ($process.ExitCode -ne 0 -or $log -match '(?m)^(ERROR:|SCRIPT ERROR:)' -or
                $log -notmatch "DESKTOWN_CI_SAVE_SMOKE_OK:$phase") {
              throw "Exported DeskTown.exe $phase phase failed with exit code $($process.ExitCode)."
            }
          }
          if (-not (Test-Path $env:DESKTOWN_CI_SMOKE_SAVE)) {
            throw 'The exported app did not create its isolated save file.'
          }

      - name: Open demo states in exported executable
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'build/windows/DeskTown.exe').Path
          foreach ($scenario in @('workshop-repairing', 'workshop-reveal-pending', 'railway-teaser')) {
            $directory = Join-Path $env:RUNNER_TEMP ('desktown-demo-' + [guid]::NewGuid().ToString('N'))
            New-Item -ItemType Directory -Path $directory | Out-Null
            $env:DESKTOWN_DEMO_SAVE = Join-Path $directory 'save.json'
            Copy-Item (Join-Path "build/demo-saves/$scenario" 'save.json') $env:DESKTOWN_DEMO_SAVE
            $stdout = Join-Path $directory 'stdout.log'
            $stderr = Join-Path $directory 'stderr.log'
            $process = Start-Process -FilePath $exe -ArgumentList @('--headless', '--quit-after', '120', '--', '--desktown-demo') -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
            if (-not $process.WaitForExit(45000)) {
              $process.Kill()
              throw "Demo $scenario did not exit within 45 seconds."
            }
            $log = (Get-Content $stdout -Raw) + "`n" + (Get-Content $stderr -Raw)
            Write-Output "$scenario`: $log"
            if ($process.ExitCode -ne 0 -or $log -match '(?m)^(ERROR:|SCRIPT ERROR:)') {
              throw "Exported demo $scenario failed with exit code $($process.ExitCode)."
            }
          }

      - name: Package complete Windows export
        shell: pwsh
        run: |
          $export = (Resolve-Path 'build/windows').Path
          $files = @(Get-ChildItem $export -Recurse -File | Sort-Object FullName | ForEach-Object {
            [ordered]@{
              path = [IO.Path]::GetRelativePath($export, $_.FullName).Replace('\', '/')
              bytes = $_.Length
              sha256 = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            }
          })
          if (-not ($files | Where-Object { $_.path -eq 'DeskTown.exe' })) {
            throw 'Export is missing DeskTown.exe.'
          }
          $shortSha = $env:GITHUB_SHA.Substring(0, 8)
          $package = 'build/package'
          New-Item -ItemType Directory -Path $package -Force | Out-Null
          $manifest = [ordered]@{
            product = 'DeskTown Prototype v0.1'
            commit = $env:GITHUB_SHA
            godot = $env:GODOT_VERSION
            dotnetSdk = '8.0.425'
            signed = $false
            files = $files
          }
          $manifest | ConvertTo-Json -Depth 6 | Set-Content (Join-Path $package 'build-manifest.json') -Encoding utf8
          @(
            'DeskTown Prototype v0.1 — unsigned Windows x64 preview'
            "Commit: $env:GITHUB_SHA"
            'Extract the entire ZIP before launching DeskTown.exe.'
            'Ghost Focus remains disabled pending Windows click-through review.'
            'Manual Windows 11 UI, DPI, notice, save-location, and art gates remain open.'
          ) | Set-Content (Join-Path $package 'RELEASE-NOTES.txt') -Encoding utf8
          $zip = Join-Path $package "DeskTown-v0.1-$shortSha-win-x64.zip"
          Compress-Archive -Path (Join-Path $export '*') -DestinationPath $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path $zip -Leaf)" | Set-Content (Join-Path $package 'SHA256SUMS.txt') -Encoding ascii
          $unpacked = Join-Path $env:RUNNER_TEMP ('desktown-package-' + [guid]::NewGuid().ToString('N'))
          Expand-Archive -Path $zip -DestinationPath $unpacked
          foreach ($file in $files) {
            $candidate = Join-Path $unpacked $file.path
            if (-not (Test-Path $candidate) -or
                (Get-FileHash $candidate -Algorithm SHA256).Hash.ToLowerInvariant() -ne $file.sha256) {
              throw "Packaged file differs from the tested export: $($file.path)"
            }
          }
          $stdout = Join-Path $env:RUNNER_TEMP 'desktown-package-stdout.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'desktown-package-stderr.log'
          $process = Start-Process -FilePath (Join-Path $unpacked 'DeskTown.exe') -ArgumentList @('--headless', '--quit-after', '120') -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          if (-not $process.WaitForExit(45000)) {
            $process.Kill()
            throw 'Unpacked DeskTown.exe timed out.'
          }
          $log = (Get-Content $stdout -Raw) + "`n" + (Get-Content $stderr -Raw)
          if ($process.ExitCode -ne 0 -or $log -match '(?m)^(ERROR:|SCRIPT ERROR:)') {
            throw 'Unpacked DeskTown.exe failed startup smoke.'
          }

      - name: Upload versioned prototype ZIP
        uses: actions/upload-artifact@v4
        with:
          name: desktown-windows-prototype-package
          path: build/package/*
          if-no-files-found: error

      - name: Assemble and verify laptop QA kit
        shell: pwsh
        run: |
          $kit = 'build/qa-kit'
          New-Item -ItemType Directory -Path $kit | Out-Null
          Copy-Item build/package/* $kit
          Copy-Item scripts/qa/*.ps1 $kit
          Copy-Item scripts/qa/QA-README.md $kit
          Copy-Item docs/qa/WINDOWS_GATE.md $kit
          Copy-Item build/demo-saves (Join-Path $kit 'demo-saves') -Recurse
          & (Join-Path $kit 'preflight.ps1') -KitDirectory $kit -RunSmoke
          & (Join-Path $kit 'collect-evidence.ps1') -KitDirectory $kit -Scaling 'CI' -OutputPath (Join-Path $env:RUNNER_TEMP 'desktown-qa-results.md')
          if (-not (Select-String -Path (Join-Path $env:RUNNER_TEMP 'desktown-qa-results.md') -Pattern $env:GITHUB_SHA -Quiet)) {
            throw 'QA result template does not identify the build.'
          }
          Remove-Item (Join-Path $kit 'app') -Recurse -Force

      - name: Upload laptop QA kit
        uses: actions/upload-artifact@v4
        with:
          name: desktown-windows-qa-kit
          path: build/qa-kit/*
          if-no-files-found: error
