name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  GODOT_VERSION: 4.7.2

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.425

      - name: Validate repository structure
        run: bash scripts/validate-project-structure.sh

      - name: Restore
        run: dotnet restore DeskTown.sln

      - name: Build
        run: dotnet build DeskTown.sln --configuration Release --no-restore

      - name: Test
        run: >-
          dotnet test DeskTown.sln
          --configuration Release
          --no-build
          --logger "trx;LogFileName=tests.trx"
          --collect "XPlat Code Coverage"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/**'
          if-no-files-found: warn

  godot-windows-export:
    name: Godot import and Windows export
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.425

      - name: Restore and build C#
        run: |
          dotnet restore DeskTown.sln
          dotnet build DeskTown.sln --configuration Release --no-restore

      - name: Install Godot .NET and export templates
        run: bash scripts/ci/install-godot.sh

      - name: Import project headlessly
        run: godot --headless --editor --path . --quit-after 5

      - name: Launch main scene headlessly
        run: |
          mkdir -p build
          godot --headless --path . --quit-after 120 2>&1 | tee build/runtime-smoke.log
          if rg -n '^ERROR:|SCRIPT ERROR:' build/runtime-smoke.log; then
            exit 1
          fi

      - name: Export Windows prototype
        run: |
          mkdir -p build/windows
          godot --headless --path . --export-release "Windows Desktop" build/windows/DeskTown.exe

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: desktown-windows-foundation
          path: build/windows/**
          if-no-files-found: error
